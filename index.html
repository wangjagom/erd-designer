<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERD 설계 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet toolbar, an endless dotted canvas with soft-colored tables, and an inspector that edits whatever is selected. */
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --ink: #141a24;
  --ink-2: #3a4452;
  --muted: #6b7584;
  --line: #e2e6ec;
  --line-2: #cfd5de;
  --accent: #0f766e;
  --accent-soft: #dcf2ee;
  --edge: #9aa3b2;
  --pk: #e0a800; --pk-soft: #fdf3c4;
  --fk: #4338ca; --fk-soft: #e5e7fb;
  --danger: #be1d2c;
  --dot: #dde1e8;
  --node: #ffffff; --head: #f1f3f6; --title: #fafbfc; --card-line: #dde2e9; --card-line-2: #c3cad5; --grid: #eef1f5; --grid-strong: #9aa4b2;
  --shadow: 0 1px 2px rgb(20 26 36 / .06), 0 6px 18px rgb(20 26 36 / .07);
  --h0: #e1f3f0; --s0: #0f766e; --h1: #e2ecfb; --s1: #2563eb; --h2: #ebe6fb; --s2: #7c3aed;
  --h3: #fbe5ea; --s3: #e11d48; --h4: #faefd6; --s4: #d97706; --h5: #e7eaef; --s5: #64748b;
  --font-ui: 'Inter', 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --panel: #161c24; --ink: #e9eef4; --ink-2: #c5cdd8; --muted: #8f9bab; --line: #252e3a; --line-2: #36414f;
    --accent: #2dd4bf; --accent-soft: #123835; --edge: #66727f;
    --pk: #facc15; --pk-soft: #3a3212; --fk: #a5b4fc; --fk-soft: #24285a; --danger: #f87171; --dot: #202833; --node: #1a222c; --head: #222b36; --title: #1f2731; --card-line: #2e3946; --card-line-2: #445163; --grid: #26303c; --grid-strong: #5d6b7c;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 22px rgb(0 0 0 / .35);
    --h0: #15332f; --s0: #2dd4bf; --h1: #17283f; --s1: #60a5fa; --h2: #2a2147; --s2: #a78bfa;
    --h3: #3d1f2b; --s3: #fb7185; --h4: #3b2e14; --s4: #fbbf24; --h5: #232a35; --s5: #94a3b8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --panel: #161c24; --ink: #e9eef4; --ink-2: #c5cdd8; --muted: #8f9bab; --line: #252e3a; --line-2: #36414f;
  --accent: #2dd4bf; --accent-soft: #123835; --edge: #66727f;
  --pk: #facc15; --pk-soft: #3a3212; --fk: #a5b4fc; --fk-soft: #24285a; --danger: #f87171; --dot: #202833; --node: #1a222c; --head: #222b36; --grid: #2c3643; --grid-strong: #5d6b7c;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 22px rgb(0 0 0 / .35);
  --h0: #15332f; --s0: #2dd4bf; --h1: #17283f; --s1: #60a5fa; --h2: #2a2147; --s2: #a78bfa;
  --h3: #3d1f2b; --s3: #fb7185; --h4: #3b2e14; --s4: #fbbf24; --h5: #232a35; --s5: #94a3b8; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage, #stage *, .zoom, .hint { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage text { pointer-events: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* toolbar */
.bar { display: flex; align-items: center; gap: 10px 18px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; white-space: nowrap; flex: none; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.bar::-webkit-scrollbar { height: 6px; }
.bar::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
.bar > * { flex-shrink: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
@media (max-width: 1400px) { .brand small { display: none; } }
.brand small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.sp { flex: 1; min-width: 4px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink-2); font-weight: 500; transition: border-color .12s, background .12s, color .12s; }
.btn:hover:not(:disabled) { border-color: var(--line-2); background: var(--bg); color: var(--ink); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent); color: var(--panel); filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--bg); border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger:hover:not(:disabled) { border-color: var(--danger); background: transparent; color: var(--danger); }
.btn.sq { width: 32px; padding: 0; justify-content: center; }
select.btn { padding-right: 8px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 500; }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(20 26 36 / .14), 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .4; cursor: default; }
.seg.wrap { flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 2px; color: var(--ink-2); font-weight: 500; cursor: pointer; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .tr { width: 30px; height: 18px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .15s; }
.switch .tr::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
.switch input:checked + .tr { background: var(--accent); }
.switch input:checked + .tr::after { transform: translateX(12px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--accent); outline-offset: 2px; }

/* workspace */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 344px; }
.stage-wrap { position: relative; min-width: 0; min-height: 0; }
/* Figma-style collapse: panel button in the inspector header, floating pill on the canvas when closed */
.side-pill { position: absolute; top: 12px; right: 12px; z-index: 5; display: none; align-items: center; gap: 8px; max-width: min(280px, calc(100% - 24px)); height: 40px; padding: 0 6px 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.side-pill:hover { border-color: var(--line-2); }
.side-pill .sp-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-pill .sp-ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); flex: none; }
.side-pill:hover .sp-ic { background: var(--bg); color: var(--ink); }
.side-pill svg.i { width: 17px; height: 17px; }
.ib.side-close { flex: none; }
@media (min-width: 861px) {
  .work.noside { grid-template-columns: minmax(0, 1fr); }
  .work.noside .side { display: none; }
  .work.noside .side-pill { display: flex; }
}
@media (max-width: 860px) { .ib.side-close { display: none; } }
#stage { text-rendering: geometricPrecision; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; background: var(--bg); }
#stage.panning { cursor: grabbing; }
#stage.relmode { cursor: crosshair; }
.hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); padding: 9px 16px 9px 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; pointer-events: none; box-shadow: var(--shadow); }
.hint::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.hint.warn::before { background: #fb7185; }
.hint[hidden] { display: none; }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.zoom button { height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); }
.zoom button:hover { background: var(--bg); }
.zoom span { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* svg parts */
.node { cursor: grab; }
.node:active { cursor: grabbing; }
.node.c0 { --h: var(--h0); --s: var(--s0); } .node.c1 { --h: var(--h1); --s: var(--s1); } .node.c2 { --h: var(--h2); --s: var(--s2); }
.node.c3 { --h: var(--h3); --s: var(--s3); } .node.c4 { --h: var(--h4); --s: var(--s4); } .node.c5 { --h: var(--h5); --s: var(--s5); }
.n-shadow { fill: var(--node); filter: drop-shadow(0 1px 2px rgb(16 24 40 / .06)) drop-shadow(0 4px 12px rgb(16 24 40 / .07)); }
.n-box { fill: var(--node); }
.n-frame { fill: none; stroke: var(--card-line); stroke-width: 1; }
.node:hover .n-frame { stroke: var(--card-line-2); }
.node.sel .n-frame { stroke: var(--accent); stroke-width: 2; }
.node.pend .n-frame { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
.n-head { fill: var(--title); }
.n-grid { stroke: var(--grid); stroke-width: 1; }
.n-name { font: 700 14px var(--font-ui); fill: var(--ink); letter-spacing: -.005em; }
.n-ko { font: 500 12.5px var(--font-ui); fill: var(--muted); }
.n-rowhit { fill: var(--accent); opacity: 0; }
#stage.relmode .n-rowhit:hover { opacity: .08; }
.n-rowhit.on { opacity: .14 !important; }
.k-ico { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.k-ico.pk { stroke: var(--pk); } .k-ico.fk { stroke: var(--fk); }
.c-name { font: 500 13px var(--font-ui); fill: var(--ink-2); }
.c-name.pk { font-weight: 600; fill: var(--ink); }
.c-desc { font: 400 12.5px var(--font-ui); fill: var(--muted); }
.c-type { font: 400 11.5px var(--font-mono); fill: var(--muted); }
.r-line { fill: none; stroke: var(--edge); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; transition: stroke .12s, opacity .12s; }
.r-line.nonid { stroke-dasharray: 6 5; }
.r-mark { fill: none; stroke: var(--edge); stroke-width: 1.6; stroke-linecap: round; transition: stroke .12s, opacity .12s; }
.rel.hot .r-line, .rel.hot .r-mark, .rel.sel .r-line, .rel.sel .r-mark, .rel:hover .r-line, .rel:hover .r-mark { stroke: var(--accent); }
.rel.sel .r-line, .rel.hot .r-line { stroke-width: 2; }
.rel.dim .r-line, .rel.dim .r-mark { opacity: .35; }
.r-dot { fill: var(--bg); }
.r-hit { fill: none; stroke: transparent; stroke-width: 18; cursor: pointer; }
.r-chip-bg { fill: var(--ink); }
.r-end-bg { fill: var(--ink); }
.r-end { font: 700 11px var(--font-mono); fill: var(--bg); }
.r-chip { font: 500 11px var(--font-ui); fill: var(--bg); }

/* inspector */
.side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: thin; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec + .sec { padding-top: 18px; border-top: 1px solid var(--line); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-h h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.side p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .lab { font-size: 12px; color: var(--muted); }
.in { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); transition: border-color .12s, box-shadow .12s, background .12s; }
.in:hover { border-color: var(--line-2); }
.in:focus { border-color: var(--accent); background: var(--panel); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.mono { font-family: var(--font-mono); font-size: 13px; }
.swatches { display: flex; gap: 8px; }
.sw { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-2); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.cols { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.col { display: grid; grid-template-columns: 32px 32px minmax(0, 1fr) 28px; gap: 4px 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.col:last-child { border-bottom: 0; }
.col .in { height: 30px; padding: 0 8px; font-family: var(--font-mono); font-size: 12.5px; background: transparent; border-color: transparent; }
.col .in:hover { background: var(--bg); }
.col .in:focus { background: var(--panel); border-color: var(--accent); }
.pkbtn { height: 24px; border: 1px solid var(--line-2); border-radius: 6px; background: transparent; color: var(--muted); font: 600 9.5px var(--font-mono); padding: 0; letter-spacing: .02em; }
.pkbtn:hover:not(:disabled) { border-color: var(--pk); color: var(--pk); }
.pkbtn[aria-pressed="true"] { background: var(--pk-soft); border-color: var(--pk); color: var(--pk); }
.pkbtn:disabled { cursor: default; opacity: .6; }
.pkbtn.fkbtn:hover:not(:disabled) { border-color: var(--fk); color: var(--fk); }
.pkbtn.fkbtn[aria-pressed="true"] { background: var(--fk-soft); border-color: var(--fk); color: var(--fk); }
.fkpick { display: flex; align-items: center; gap: 6px; width: 100%; }
.fkpick select { flex: 1; min-width: 0; height: 30px; padding: 0 6px; border: 1px solid var(--fk); border-radius: 7px; background: var(--panel); font-family: var(--font-mono); font-size: 12px; }
.fkpick .txt { color: var(--fk); font-size: 12px; flex: none; }
.xbtn { display: grid; place-items: center; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 0; }
.xbtn:hover { background: var(--bg); color: var(--danger); }
.col .in.desc { grid-column: 3 / 4; height: 28px; font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-2); }
.col .in.desc::placeholder { color: var(--muted); opacity: .7; }
.col .sub { grid-column: 3 / -1; display: flex; align-items: center; gap: 10px; padding-left: 8px; font-size: 12px; color: var(--muted); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.fkinfo { color: var(--fk); font-family: var(--font-mono); font-size: 11.5px; }
.legend { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 13px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 12px; }
.legend svg.lg { flex: none; width: 48px; height: 20px; color: var(--edge); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.pill { display: inline-grid; place-items: center; width: 28px; height: 18px; border-radius: 5px; font: 600 9px var(--font-mono); }
.pill.pk { background: var(--pk-soft); color: var(--pk); } .pill.fk { background: var(--fk-soft); color: var(--fk); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.steps li { position: relative; padding-left: 32px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 600; display: grid; place-items: center; }
.steps b { color: var(--ink); font-weight: 600; }
.relhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.relhead b { font: 600 13px var(--font-mono); }
.relhead .card { font: 600 11px var(--font-mono); padding: 2px 7px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }

/* modal */
.veil { position: fixed; inset: 0; background: rgb(8 12 18 / .5); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.veil[hidden] { display: none; }
.modal { width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
.modal h3 { margin: 0; font-size: 16px; font-weight: 600; }
.modal textarea { width: 100%; height: min(52vh, 440px); resize: vertical; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font: 400 12.5px/1.7 var(--font-mono); white-space: pre; overflow: auto; tab-size: 2; }
.modal textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.modal .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.modal .foot .note { color: var(--muted); font-size: 12.5px; margin-right: auto; }


/* ===== v13 chrome refresh ===== */
.bar { gap: 10px 12px; padding: 0 14px; height: 56px; }
@media (max-width: 1480px) { .bar { gap: 8px; } }
@media (max-width: 1400px) { .brand .bt { display: none; } }
.brand { align-items: center; gap: 10px; }
.logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; flex: none; }
.logo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bt { display: flex; flex-direction: column; line-height: 1.15; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
.bt small { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
@media (max-width: 1400px) { .bt small { display: none; } }
.vr { width: 1px; height: 24px; background: var(--line); flex: none; }
.btn { height: 36px; border-radius: 9px; padding: 0 14px; font-size: 13.5px; }
.btn.sq { width: 36px; }
.btn.primary { box-shadow: 0 1px 2px rgb(16 24 40 / .12), inset 0 1px 0 rgb(255 255 255 / .12); }
.seg { padding: 3px; border-radius: 10px; }
.seg button { height: 30px; font-size: 13.5px; }
.bar .seg button[aria-pressed="true"] { color: var(--accent); }

.side { padding: 0 0 28px; gap: 0; }
.ph { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.ph-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); flex: none; }
.ph-ic svg.i { width: 18px; height: 18px; }
.ph-tx { min-width: 0; flex: 1; }
.ph-t { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.ph-t .arrow { color: var(--muted); font-weight: 500; }
.ph-s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.ph-act { display: flex; gap: 4px; flex: none; }
.ib { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); }
.ib:hover { background: var(--bg); color: var(--ink); border-color: var(--line); }
.ib.danger:hover { color: var(--danger); }

<header class="bar" role="toolbar" aria-label="도구 모음">
  <div class="brand"><span class="logo" aria-hidden="true"><svg class="t3" viewBox="0 0 64 64"><use href="#t-erd-teal-E"/></svg></span><span class="bt">ERD 설계 도구<small>Entity Relationship Diagram</small></span></div><span class="vr" aria-hidden="true"></span>
  <button class="btn primary" id="add-table" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>표 추가</button>
  <div class="seg" role="group" aria-label="그리기 도구">
    <button id="tool-select" type="button" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l13 6-5.5 2L11 18z"/></svg>선택</button>
    <button type="button" aria-pressed="false" data-kind="11"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20M8 7v10M12 7v10"/></svg>1:1</button>
    <button type="button" aria-pressed="false" data-kind="1N"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h12M14 12l7-5M14 12h8M14 12l7 5M5 7v10"/></svg>1:N</button>
    <button type="button" aria-pressed="false" data-kind="NM"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10M7 12L2 7M7 12H2M7 12l-5 5M17 12l5-5M17 12h5M17 12l5 5"/></svg>N:M</button>
  </div>
  <span class="vr" aria-hidden="true"></span><label class="switch" for="rel-id" title="자식 표의 키에 부모 키가 포함돼요"><input type="checkbox" id="rel-id"><span class="tr"></span>식별 관계</label><label class="switch" for="detail-on" title="데이터 타입과 필수(NOT NULL)까지 설정하고 SQL로 볼 수 있어요"><input type="checkbox" id="detail-on"><span class="tr"></span>상세 설정</label>
  <span class="sp"></span>
  <button class="btn ghost sq" id="view-btn" type="button" aria-label="보기 설정" title="보기 설정" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button class="btn ghost sq" id="undo" type="button" disabled aria-label="실행 취소" title="실행 취소 (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="btn ghost sq" id="redo" type="button" disabled aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
  <span class="vr" aria-hidden="true"></span><select class="btn" id="example" aria-label="예제 불러오기">
    <option value="">예제</option>
    <option value="school">학생·반·과목·수강</option>
    <option value="shop">쇼핑몰</option>
    <option value="blank">빈 판</option>
  </select>
  <button class="btn" id="show-sql" type="button" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></svg>SQL 보기</button>
  <button class="btn ghost sq" id="show-json" type="button" aria-label="JSON 내보내기·가져오기" title="JSON 내보내기·가져오기"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-2"/></svg></button>
  <button class="btn" id="cloud-btn" type="button" title="로그인하고 클라우드에 저장"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.1 4.5 4.5 0 0 0 7 18z"/></svg><span id="cloud-label">로그인</span></button>
  <button class="btn primary" id="cloud-save" type="button" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span id="cloud-save-label">저장</span></button></header>

<div class="pop" id="view-pop" hidden role="dialog" aria-label="보기 설정">
  <p class="pop-t">선 모양</p>
  <div class="lines" role="group" aria-label="선 모양">
    <button type="button" data-line="curve" aria-pressed="false"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M4 8C34 8 30 24 60 24"/></svg>곡선</button>
    <button type="button" data-line="ortho" aria-pressed="false"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M4 8H26a6 6 0 0 1 6 6v4a6 6 0 0 0 6 6H60"/></svg>직각</button>
    <button type="button" data-line="straight" aria-pressed="false"><svg viewBox="0 0 64 32" aria-hidden="true"><path d="M4 8H12L52 24H60"/></svg>직선</button>
  </div>
</div>
<main class="work">
  <div class="stage-wrap">
    <svg id="stage" role="application" aria-label="ERD 그림판">
      <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="var(--dot)"/></pattern></defs>
      <rect id="grid" width="100%" height="100%" fill="url(#dots)"/>
      <g id="world"><g id="layer-rels"></g><g id="layer-tables"></g></g>
    </svg>
    <div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
    <div class="zoom" role="group" aria-label="확대 축소">
      <button type="button" id="zoom-out" aria-label="축소">−</button>
      <span id="zoom-val">100%</span>
      <button type="button" id="zoom-in" aria-label="확대">+</button>
      <button type="button" id="zoom-fit">맞춤</button>
    </div>
    <button type="button" class="side-pill" id="side-open" aria-controls="side" title="속성 패널 열기 (Ctrl+\)"><span class="sp-t" id="side-pill-t">속성</span><span class="sp-ic" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></span></button>
  </div>
  <aside class="side" id="side" aria-label="속성 편집"></aside>
</main>

<div class="veil" id="veil" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h3 id="m-title"></h3>
    <textarea id="m-text" spellcheck="false" aria-labelledby="m-title"></textarea>
    <div class="foot">
      <span class="note" id="m-note"></span>
      <button class="btn" id="m-apply" type="button" hidden>이 내용으로 불러오기</button>
      <button class="btn primary" id="m-copy" type="button">복사</button>
      <button class="btn" id="m-close" type="button">닫기</button>
    </div>
  </div>
</div>
<datalist id="types">
  <option value="INT"></option><option value="BIGINT"></option><option value="VARCHAR(50)"></option><option value="VARCHAR(100)"></option>
  <option value="CHAR(10)"></option><option value="DECIMAL(10,2)"></option><option value="DATE"></option><option value="DATETIME"></option>
  <option value="TEXT"></option><option value="BOOLEAN"></option>
  <option value="CHAR(4)"></option><option value="NUMC(10)"></option><option value="DATS"></option><option value="TIMS"></option><option value="CURR(13,2)"></option><option value="QUAN(13,3)"></option>
</datalist>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var NS = 'http://www.w3.org/2000/svg';
  var TITLE = 44, CH = 0, HEAD = TITLE + CH, ROW = 34, KEY = 'erd-designer-v1';

  /* ---------------- model ---------------- */
  var S = { tables: [], rels: [], seq: 1 };
  var V = { x: 40, y: 40, k: 1 };
  var sel = null;            // { type: 't' | 'r', id }
  var tool = null;           // null (select) | '11' | '1N' | 'NM'
  var identOn = false;
  var pending = null;        // id of the first table in relation mode

  var detail = false;        // detail mode: data types and NOT NULL

  try { detail = localStorage.getItem('erd-detail') === '1'; } catch (e) { detail = false; }
  var hist = [], redo = [];

  function uid(p) { return p + (S.seq++); }
  function T(id) { for (var i = 0; i < S.tables.length; i++) if (S.tables[i].id === id) return S.tables[i]; return null; }
  function R(id) { for (var i = 0; i < S.rels.length; i++) if (S.rels[i].id === id) return S.rels[i]; return null; }
  function C(t, id) { for (var i = 0; i < t.cols.length; i++) if (t.cols[i].id === id) return t.cols[i]; return null; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function el(name, attrs, parent, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n); return n;
  }
  function colorOf(t) { var i = S.tables.indexOf(t); return t.color != null ? t.color % 6 : i % 6; }

  function newTable(name, ko, x, y, cols, color) {
    var t = { id: uid('t'), name: name, ko: ko || '', x: x, y: y, color: color != null ? color : S.tables.length % 6, cols: [] };
    (cols || []).forEach(function (c) { t.cols.push({ id: uid('c'), name: c[0], type: c[1], pk: !!c[2], nn: !!c[2], fk: null, auto: false, desc: c[3] || '' }); });
    S.tables.push(t); return t;
  }
  function addRel(parent, child, kind, ident, optional) {
    var r = { id: uid('r'), parent: parent.id, child: child.id, kind: kind, ident: !!ident && parent !== child, optional: !!optional };

  }

  /* Foreign key columns follow the parent's primary key automatically. */
  function uniqueName(t, base, except) {
    var n = base, i = 2;
    while (t.cols.some(function (c) { return c !== except && c.name === n; })) n = base + '_' + (i++);
    return n;

  var sidePinned = true, sideDismissed = false;
  try { sidePinned = localStorage.getItem('erd-side-open') !== '0'; } catch (x) { /* ignore */ }
  function pinSide(open, focus) {
    sidePinned = open; sideDismissed = !open;
    try { localStorage.setItem('erd-side-open', open ? '1' : '0'); } catch (x) { /* ignore */ }
    applySide();
    if (focus) { var f = isSideOpen() ? document.getElementById('side-close') : sideOpenBtn; if (f) f.focus(); }
  }
  sideOpenBtn.addEventListener('click', function () { pinSide(true, true); });
  side.addEventListener('click', function (e) { if (e.target.closest('#side-close')) pinSide(false, true); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === '\\' || e.code === 'Backslash')) { e.preventDefault(); if (!mobile()) pinSide(!isSideOpen(), false); }
  });
  applySide();

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (!$('#veil').hidden) { if (e.key === 'Escape') closeModal(); return; }
    if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redoIt(); else undo(); return; }
    if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); redoIt(); return; }
    if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'c') {
      if (sel && sel.type === 't') { e.preventDefault(); copyTable(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'v') {
      if (clip) { e.preventDefault(); pasteTable(); }
      return;
    }
    if (e.key === 'Escape') { if (tool) setTool(null); else selectIt(null); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && sel) { e.preventDefault(); deleteSel(); }
  });

  /* ---------------- export / import ---------------- */
  function genSQL() {
    var done = {}, order = [];
    function visit(t) {
      if (done[t.id]) return; done[t.id] = 1;
      S.rels.forEach(function (r) { if (r.child === t.id && r.parent !== t.id) visit(T(r.parent)); });
      order.push(t);
    }
    S.tables.forEach(visit);
    var out = ['-- ERD 설계 도구에서 생성한 SQL (일반 SQL 문법)', '-- SAP에서는 이 구조를 데이터 사전(SE11)에서 정의해요. 참고용으로 보세요.', ''];
    function cm(s) { return String(s).trim().split('\n').map(function (l) { return '--   ' + l; }); }
    if (S.db || (S.desc || '').trim()) {
      if (S.db) out.push('-- DB: ' + S.db);
      if ((S.desc || '').trim()) out.push.apply(out, ['-- 설명:'].concat(cm(S.desc)));
      out.push('');
    }
    order.forEach(function (t) {
      S.rels.filter(function (r) { return r.child === t.id && (r.desc || '').trim(); }).forEach(function (r) {
        out.push('-- 관계 ' + T(r.parent).name + ' → ' + t.name + ':');
        out.push.apply(out, cm(r.desc));
      });
      var lines = [], pks = t.cols.filter(function (c) { return c.pk; });
      t.cols.forEach(function (c) { lines.push('  ' + c.name + ' ' + c.type + (c.nn || c.pk ? ' NOT NULL' : '')); });
      if (pks.length) lines.push('  PRIMARY KEY (' + pks.map(function (c) { return c.name; }).join(', ') + ')');
      S.rels.filter(function (r) { return r.child === t.id; }).forEach(function (r) {
        var P = T(r.parent), pp = P.cols.filter(function (c) { return c.pk; }), fks = [];
        pp.forEach(function (p) { t.cols.forEach(function (c) { if (c.fk && c.fk.rel === r.id && c.fk.ref === p.id) fks.push(c); }); });
        if (!fks.length) return;
        lines.push('  FOREIGN KEY (' + fks.map(function (c) { return c.name; }).join(', ') + ') REFERENCES ' + P.name + ' (' + pp.map(function (c) { return c.name; }).join(', ') + ')');
        if (r.kind === '11' && !r.ident) lines.push('  UNIQUE (' + fks.map(function (c) { return c.name; }).join(', ') + ')');
      });
      out.push('CREATE TABLE ' + t.name + ' ( ' + (t.ko ? '-- ' + t.ko : ''));
      out.push(lines.join(',\n') + '\n);', '');
    });
    if (!order.length) out.push('-- 표가 아직 없어요. 표를 추가해 보세요.');
    return out.join('\n');
  }
  function openModal(m) {
    var ta = $('#m-text');
    if (m === 'sql') { $('#m-title').textContent = 'SQL 보기'; ta.value = genSQL(); ta.readOnly = true; $('#m-note').textContent = '표 사이의 순서와 FK까지 포함한 CREATE TABLE 문이에요.'; $('#m-apply').hidden = true; }
    else { $('#m-title').textContent = 'JSON 내보내기·가져오기'; ta.value = JSON.stringify(S, null, 1); ta.readOnly = false; $('#m-note').textContent = '내용을 복사해 두었다가 아래 칸에 붙여넣고 불러올 수 있어요.'; $('#m-apply').hidden = false; }
    $('#veil').hidden = false; ta.focus();
  }
  function closeModal() { $('#veil').hidden = true; }
  $('#show-sql').addEventListener('click', function () { openModal('sql'); });
  $('#show-json').addEventListener('click', function () { openModal('json'); });
  $('#m-close').addEventListener('click', closeModal);
  $('#veil').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  $('#m-copy').addEventListener('click', function () {
    var ta = $('#m-text'), btn = this;
    function done(ok) { btn.textContent = ok ? '복사됨' : '선택됨. Ctrl+C를 누르세요'; setTimeout(function () { btn.textContent = '복사'; }, 1800); }
    ta.focus(); ta.select();
    try { navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { done(false); }); } catch (x) { done(false); }
  });
  $('#m-apply').addEventListener('click', function () {
    try {
      var d = JSON.parse($('#m-text').value);
      if (!d || !Array.isArray(d.tables) || !Array.isArray(d.rels)) throw new Error('bad');
      d.seq = d.seq || 1000; closeModal(); if (window.ERD && window.ERD.onReset) window.ERD.onReset(); freshStart(d);
    } catch (x) { $('#m-note').textContent = '형식이 맞지 않아요. 복사해 둔 내용을 그대로 붙여넣어 주세요.'; }
  });

  /* ---------------- start ---------------- */
  window.addEventListener('resize', function () { applyView(); sheetApply(); });
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) { saved = null; }
  if (saved && Array.isArray(saved.tables) && saved.tables.length) { S = saved; syncAll(); hist = [snapshot()]; drawCanvas(); renderSide(); updateUndo(); fit(); }
  else freshStart(exSchool());

  /* ---------------- bridge for cloud.js ---------------- */
  window.ERD = {
    get: function () { return JSON.parse(snapshot()); },
    load: function (d) { if (!d || !Array.isArray(d.tables) || !Array.isArray(d.rels)) throw new Error('bad'); d.seq = d.seq || 1000; freshStart(d); },
    isEmpty: function () { return !S.tables.length; },
    firstName: function () { return S.tables.length ? S.tables[0].name : ''; },
    dbName: function () { return (S.db || '').trim(); },
    counts: function () { return { tables: S.tables.length, rels: S.rels.length }; },
    hint: hint,
    onReset: null,
    onChange: null
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { mcache = {}; drawCanvas(); fit(); });
})();
</script>
